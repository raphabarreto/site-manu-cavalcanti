<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#grad)"/>
  <!-- Play button / Claquete simplificada -->
  <g transform="translate(16, 20)">
    <!-- Base branca -->
    <rect x="0" y="8" width="32" height="22" rx="2" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Listras pretas -->
    <rect x="0" y="8" width="6" height="5" fill="#1e293b"/>
    <rect x="8" y="8" width="6" height="5" fill="#1e293b"/>
    <rect x="16" y="8" width="6" height="5" fill="#1e293b"/>
    <rect x="24" y="8" width="8" height="5" fill="#1e293b"/>
    <!-- Tampa rosa -->
    <path d="M 0 8 L 32 8 L 30 2 L 2 2 Z" fill="#ffffff" fill-opacity="0.9"/>
  </g>
